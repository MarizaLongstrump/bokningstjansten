<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreateRoom</title>
</head>
<body>
<form th:action="@{/rooms/create}" th:object="${room}" method="post">

    <label>Rumsnummer:</label>
    <input type="number" th:field="*{roomNumber}" required><br><br>

    <label>Våning:</label>
    <input type="number" th:field="*{floor}" required><br><br>

    <label>Typ:</label>
    <select th:field="*{roomType}">
        <option value="Single">SINGLE</option>
        <option value="Double">DOUBLE</option>
        <option value="Master">MASTER</option>
    </select><br><br>

    <label>Pris per natt:</label>
    <input type="number" step="0.01" th:field="*{pricePerNight}" required><br><br>

    <label>Hotel ID:</label>
    <input type="number" th:field="*{hotelId}" required><br><br>

    <label>Städat:</label>
    <input type="checkbox" th:field="*{clean}"><br><br>

    <button type="submit">Skapa rum</button>
</form>

</body>
</html>
