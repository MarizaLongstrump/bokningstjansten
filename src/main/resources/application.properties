spring.application.name=bokningstjänsten



# MySQL
spring.datasource.url=jdbc:mysql://${SPRING_HOSTNAME}:3306/hotel_backend2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://localhost:3306/bookingTest
spring.datasource.username=${SPRING_USER}
spring.datasource.password=${SPRING_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

#customer-service.url=${CUSTOMER_SERVICE}
customer-service.url=http://customer-service.com


