<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bookingForms</title>
</head>
<body>

<nav>
    <a href="/">Home</a> |
    <a href="/rooms">All Rooms</a> |
    <a href="/bookings">All Bookings</a> |
    <a href="/account/login">Login</a>|
    <a href="/register">Register User</a>|
    <a href="/account/create">Create Account</a>|
    <a href="/account/details">Account Details</a>|

</nav>

<hr>

<h2>Create Booking</h2>
<span style="color: #FF0000" th:text="${error}"></span>
<form th:action="@{/bookingForms}" th:object="${booking}" method="post">
    <input type="hidden" th:field="*{roomNumber}">

    <label>Hotel ID:</label>
    <input type="number" th:field="*{hotelId}" required>

    <label>Check-in Date:</label>
    <input type="date" th:field="*{checkInDate}" required>

    <label>Check-out Date:</label>
    <input type="date" th:field="*{checkOutDate}" required>

    <label>Extra Bed:</label>
    <input type="checkbox" th:field="*{extraBed}">

    <button type="submit">Create Booking</button>
</form>


</body>
</html>
