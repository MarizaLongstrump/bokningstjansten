<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings</title>
</head>
<body>
<nav>
    <a href="/">Home</a> |
    <a href="/rooms">All Rooms</a> |
    <a href="/bookings">All Bookings</a> |
    <a href="/account/login">Login</a>|
    <a href="/register">Register User</a>|
    <a href="/account/create">Create Account</a>|
    <a href="/account/details">Account Details</a>|
</nav>

<hr>

<br>
<br>
<span th:text="${message}"> </span>
<table border="1">
    <tr>
        <th>Change</th>
        <th>Delete</th>
        <th>Booking ID</th>
        <th>Room number</th>
        <th>Check in</th>
        <th>Check out</th>
    </tr>

    <h2 th:text="${'Welcome' +' ' +guestInloggade}"></h2>

    <tr th:each="booking : ${bookings}">

        <!-- UPDATE -->
        <td>
            <a th:href="@{'/booking/update/' + ${booking.bookingId}}">Change</a>
        </td>

        <!-- DELETE -->
        <td>
            <form th:action="@{'/booking/delete/' + ${booking.bookingId}}" method="post">
                <button type="submit"
                        onclick="return confirm('Are you sure you want to delete this booking?')">
                    Delete
                </button>
            </form>
        </td>

        <td th:text="${booking.bookingId}"></td>
        <td th:text="${booking.roomNumber}"></td>
        <td th:text="${booking.checkInDate}"></td>
        <td th:text="${booking.checkOutDate}"></td>

    </tr>
</table>

</body>
</html>
